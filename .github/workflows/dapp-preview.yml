# PR-triggered Netlify deploy preview for the dapp.
#
# Posts a preview URL on the PR that runs against the time-limits-removed Tansu
# deployment on testnet (so reviewers can exercise the governance flow). The
# preview environment (contract id, RPC, etc.) comes from the
# `[context.deploy-preview.environment]` block in dapp/netlify.toml.
#
# Required repository secrets:
#   NETLIFY_AUTH_TOKEN  — a Netlify personal access token
#   NETLIFY_SITE_ID     — the target Netlify site's API ID
#
# Note: secrets are not exposed to PRs from forks, so this job only runs for
# same-repo PRs. Open the demo PR within the fork that owns the Netlify site
# (e.g. willemneal/tansu) to get a preview.
#
# (Repo convention pins actions by commit SHA; pin these tags to match.)
name: dapp-preview

on:
  pull_request:
    paths:
      - "dapp/**"
      - ".github/workflows/dapp-preview.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dapp-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  netlify-preview:
    name: Netlify deploy preview
    runs-on: ubuntu-latest
    # Secrets are unavailable to fork PRs — only run for same-repo PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: ./dapp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Astro requires Node >= 22.12; the build (astro build) fails on 20.
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      - name: Install dapp dependencies
        run: bun install

      # Install the Netlify CLI globally from a directory with no package.json,
      # so it does not inherit dapp/'s npm `overrides` (which otherwise break
      # `npx netlify-cli` with EOVERRIDE).
      - name: Install Netlify CLI
        working-directory: ${{ runner.temp }}
        run: npm install -g netlify-cli@17

      - name: Deploy Netlify preview
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Disable the first-run telemetry consent prompt — it isn't gated by
          # CI=true and otherwise hangs the non-interactive deploy.
          NETLIFY_TELEMETRY_DISABLED: "1"
        run: |
          set -eo pipefail
          # `--build` lets netlify build + deploy the astro SSR site — it resolves
          # the base directory and adapter functions natively and reads the
          # deploy-preview env from netlify.toml. (The dapp's missing-React-import
          # bug, which used to fail this build, is fixed in the source.) `--site`
          # avoids a link prompt, `</dev/null` keeps it non-interactive, `timeout`
          # is a backstop, and verbose (no `--json`) keeps the URL visible to grep.
          timeout 900 netlify deploy \
            --build \
            --site "$NETLIFY_SITE_ID" \
            --context deploy-preview \
            --alias "pr-${{ github.event.number }}" \
            --message "Preview for PR #${{ github.event.number }} (${{ github.sha }})" \
            < /dev/null | tee deploy.log
          url="$(grep -oE 'https://pr-${{ github.event.number }}--[a-z0-9-]+\.netlify\.app' deploy.log | head -1)"
          [ -n "$url" ] || url="$(grep -oE 'https://[a-z0-9-]+\.netlify\.app' deploy.log | tail -1)"
          echo "Resolved preview URL: ${url:-<none>}"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.netlify.outputs.url }}";
            const marker = "<!-- tansu-dapp-preview -->";
            const body = [
              marker,
              "### 🚀 Tansu dapp preview",
              "",
              "Runs against the **time-limits-removed Tansu** on testnet " +
                "(`CDLQFXGG…HP3O` — SorobanDomain removed, per-project " +
                "`min_voting_period`/`execute_delay`).",
              "",
              `**Preview URL:** ${url}`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
